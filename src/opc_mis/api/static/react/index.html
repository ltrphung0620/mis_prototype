<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1d20" media="(prefers-color-scheme: dark)" />
    <script>
      // Resolve the theme before first paint; shared/theme.ts owns the same storage key.
      (function () {
        var preference = null;
        try {
          preference = window.localStorage.getItem("opc-mis-theme");
        } catch (error) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/dashboard-assets/favicon.svg" />
    <meta
      name="description"
      content="Bảng điều hành OPC MIS dành cho Nhà sáng lập"
    />
    <title>OPC MIS · Bảng điều hành</title>
    <script type="module" crossorigin src="/dashboard-assets/assets/index-BPTxHyqI.js"></script>
    <link rel="stylesheet" crossorigin href="/dashboard-assets/assets/index-BMo8w12U.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
